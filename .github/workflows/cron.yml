name: cron
# The fallback for rss.mobi's scheduled jobs: Vercel Cron calls them
# (vercel.json, docs/decisions/0008-off-upstash.md), and this calls fetch
# and index-check off the quarter hours in case it does not. The jobs only
# do what is due, so a second caller adds nothing. See also
# docs/decisions/0003-cron-via-github-actions.md. The log is public, so it
# prints status codes and nothing else.
on:
  schedule:
    # Off the quarter hours: GitHub delays and drops scheduled runs at the
    # top of the hour, and */15 ran every three to five hours on 23-24 Sep.
    - cron: "7,22,37,52 * * * *"
    - cron: "17 4 1 * *" # keepalive, see the job below
  workflow_dispatch:
concurrency:
  group: cron
  cancel-in-progress: false
permissions: {}
jobs:
  fetch:
    # Off until the site is deployed: set the repository variable
    # CRON_ENABLED=true. A skipped job costs nothing.
    if: (vars.CRON_ENABLED == 'true' && github.event.schedule != '17 4 1 * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Poll feeds
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 75 -o /dev/null -w '%{http_code}' -X POST https://rss.mobi/api/v1/cron/fetch \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}')
          echo "fetch: HTTP $code"
          [ "$code" -lt 300 ]
      - name: Check originals in Google
        # Runs even when polling failed: the queue it works on is already
        # stored, and the two jobs fail for different reasons.
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 75 -o /dev/null -w '%{http_code}' -X POST https://rss.mobi/api/v1/cron/index-check \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}')
          echo "index-check: HTTP $code"
          [ "$code" -lt 300 ]

  keepalive:
    # GitHub switches schedules off in a public repository after 60 days
    # with no activity. Re-enabling the workflow once a month resets that.
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/cron.yml/enable"
