name: cron
# Vercel Hobby runs cron once a day; the jobs need to run all day. See
# docs/decisions/0003-cron-via-github-actions.md.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: cron
  cancel-in-progress: false
jobs:
  jobs:
    # Off until the site is deployed: set the repository variable
    # CRON_ENABLED=true. A skipped job costs no Actions minutes.
    if: vars.CRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Poll feeds
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 75 -X POST https://rss.mobi/api/v1/cron/fetch \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}'
