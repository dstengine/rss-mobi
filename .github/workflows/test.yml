name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A throwaway MongoDB for tests/db.test.ts; nothing in it outlives the job.
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      RSS_MOBI_TEST_MONGO: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
